<!--
  The picture for link previews (Open Graph), 1200×630, drawn by the generator itself.
  ?lang=en|ru chooses the text, ?design= the picture: plan (drawings), scene (3D parts
  on the bed), pair (a 3D helical pair close up). With npm run ui running:
    chrome --headless=new --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1200,630 --hide-scrollbars
           --virtual-time-budget=10000 --screenshot=src/ui/og-scene-en.png "http://127.0.0.1:8517/tools/og-image.html?lang=en&design=scene"
  The pages list pair, plan and scene in this order, as og-<design>-<lang>.png.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gears: link preview</title>
  <link rel="stylesheet" href="../src/ui/styles.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    .card { position: relative; display: flex; width: 1200px; height: 630px; color: var(--text); }
    .text { position: relative; z-index: 1; flex: 0 0 610px; padding: 52px 0 48px 60px; display: flex; flex-direction: column; box-sizing: border-box; }
    .name { font-size: 34px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
    h1 { margin: 18px 0 0; font-size: 54px; line-height: 1.1; font-weight: 700; white-space: pre-line; }
    p { margin: 24px 0 0; font-size: 36px; line-height: 1.3; color: var(--muted); }
    .site { margin-top: auto; font-size: 34px; color: var(--accent); }
    .art { flex: 1; }
    .art svg { width: 100%; height: 100%; display: block; }
    /* the 3D view: the page background instead of the viewer's paper */
    canvas { --paper: var(--bg); position: absolute; top: 0; bottom: 0; right: 0; height: 630px; mask-image: linear-gradient(to right, transparent, #000 60px); }
  </style>
</head>
<body>
  <div class="card">
  <div class="text">
    <div class="name">Gears</div>
    <h1 id="title"></h1>
    <p id="lead"></p>
    <div class="site">https://apus-software.com/gears</div>
  </div>
  <!-- preset-thumb: the site's strokes that keep their width at any scale -->
  <div class="art preset-thumb" id="art"></div>
  </div>
  <script type="module">
    import { buildPlanView, generatePulley, validateDescription } from "../src/core/generate.js";
    import { renderPlan } from "../src/ui/drawings.js";
    import { MeshViewer } from "../src/ui/viewer.js";

    const TEXTS = {
      en: { title: "Gear and pulley generator", lead: "Print-ready models of gears, pulleys and other drive parts, right in the browser." },
      ru: { title: "Генератор шестерён\nи шкивов", lead: "Модели шестерён, шкивов и других деталей передач для 3D‑печати, прямо в браузере." }
    };
    const params = new URLSearchParams(location.search);
    const lang = params.get("lang") === "ru" ? "ru" : "en";
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = TEXTS[lang].title;
    document.getElementById("lead").textContent = TEXTS[lang].lead;

    /** An example, optionally changed for the picture: `web` replaces its web. */
    const load = async ({ name, web }) => {
      const description = await (await fetch(`../examples/valid/${name}`)).json();
      return validateDescription(web ? { ...description, web } : description);
    };

    /**
     * Where the pinion goes to mesh with the wheel at the centre along a line at the given angle:
     * rolling without slip turns it by the line angle times (1 + z1/z2), and half a pitch
     * puts its space against a wheel tooth. Pitch radii are transverse, so helical pairs mesh too.
     */
    function meshing(wheel, pinion, line) {
      const centres = wheel.derived.pitchRadius + pinion.derived.pitchRadius + (wheel.normalized.rim.profileShift + pinion.normalized.rim.profileShift) * wheel.normalized.rim.module;
      const [z1, z2] = [wheel.normalized.rim.toothCount, pinion.normalized.rim.toothCount];
      return { at: [centres * Math.cos(line), centres * Math.sin(line)], turn: 180 / z2 + (line * 180 / Math.PI) * (1 + z1 / z2) };
    }

    /** Drawings: plan views without sizes and centre lines, in millimetres. */
    async function plan() {
      const layout = [
        // the only spoked wheel of the set: the examples with spokes are too large to fit
        { name: "gear-herringbone-32t.json", at: [38, 32], web: { type: "spokes", thinning: 6, alignment: "lower", axialOffset: 0, count: 5, width: 3.5, filletRadius: 1.5 } },
        { name: "gear-herringbone-12t.json", pinionOf: 0, line: -0.75 * Math.PI },
        { name: "gear-keyed-20t.json", at: [52, -24] },
        { name: "idler-bearing.json", at: [5, -30] },
        { name: "motor-d-flat.json", at: [-5, 34] }
      ];
      const models = await Promise.all(layout.map(load));
      const parts = layout.map((item, index) => {
        const model = models[index];
        let { at, turn = 0 } = item;
        if (item.pinionOf !== undefined) {
          const pair = meshing(models[item.pinionOf], model, item.line);
          at = [layout[item.pinionOf].at[0] + pair.at[0], layout[item.pinionOf].at[1] + pair.at[1]];
          turn = pair.turn;
        }
        const ctx = { visible: new Set(), focus: null, errors: new Set(), advice: new Set(), group: null, description: model.normalized };
        const svg = new DOMParser().parseFromString(renderPlan({ ...model, plan: buildPlanView(model.normalized, model.derived) }, ctx), "image/svg+xml").documentElement;
        svg.querySelectorAll(".centre-line, .pitch-line").forEach((node) => node.remove());
        return `<g transform="translate(${at[0]} ${at[1]}) rotate(${turn})">${svg.innerHTML}</g>`;
      });
      document.getElementById("art").innerHTML = `<svg viewBox="-18 -48 95 100" xmlns="http://www.w3.org/2000/svg">${parts.join("")}</svg>`;
    }

    /** 3D: the parts standing on the bed, merged into one mesh for the site's viewer. */
    async function scene(layout, { shift = 0, ...view }, left) {
      const vertices = [], indices = [];
      const min = [Infinity, Infinity, 0], max = [-Infinity, -Infinity, -Infinity];
      const models = await Promise.all(layout.map(load));
      for (const [index, item] of layout.entries()) {
        const model = models[index];
        let { at, turn = 0 } = item;
        if (item.pinionOf !== undefined) {
          const pair = meshing(models[item.pinionOf], model, item.line);
          at = [layout[item.pinionOf].at[0] + pair.at[0], layout[item.pinionOf].at[1] + pair.at[1]];
          turn = pair.turn;
        }
        const { mesh } = generatePulley(model.normalized);
        const [c, s] = [Math.cos(turn * Math.PI / 180), Math.sin(turn * Math.PI / 180)];
        const base = vertices.length / 3;
        for (let k = 0; k < mesh.vertices.length; k += 3) {
          const [x, y, z] = [mesh.vertices[k], mesh.vertices[k + 1], mesh.vertices[k + 2] - mesh.bounds.min[2]];
          const point = [at[0] + c * x - s * y, at[1] + s * x + c * y, z];
          vertices.push(...point);
          for (let axis = 0; axis < 3; axis++) {
            min[axis] = Math.min(min[axis], point[axis]);
            max[axis] = Math.max(max[axis], point[axis]);
          }
        }
        for (const i of mesh.indices) indices.push(base + i);
      }
      const canvas = document.createElement("canvas");
      Object.assign(canvas.style, { left: `${left}px`, width: `${1200 - left}px` });
      document.querySelector(".card").prepend(canvas);
      const viewer = new MeshViewer(canvas);
      viewer.setMesh({ vertices, indices, bounds: { min, max } });
      // the camera looks along -(cos yaw, sin yaw); moving its target against the screen's right moves the parts right
      Object.assign(viewer.view, view, { pan: [shift * Math.sin(view.yaw), -shift * Math.cos(view.yaw), 0] });
      viewer.requestRender();
    }

    const designs = {
      plan,
      scene: () => scene([
        { name: "gear-herringbone-32t.json", at: [0, 0] },
        { name: "gear-herringbone-12t.json", pinionOf: 0, line: 0.62 * Math.PI },
        { name: "gear-keyed-20t.json", at: [-2, -54] },
        { name: "motor-d-flat.json", at: [36, -34] },
        { name: "idler-bearing.json", at: [48, 14] }
      ], { yaw: -0.3 * Math.PI, pitch: 0.28 * Math.PI, zoom: 0.84, shift: 5 }, 560),
      pair: () => scene([
        { name: "gear-helical-30t.json", at: [0, 0] },
        { name: "gear-helical-15t.json", pinionOf: 0, line: 0.3 * Math.PI }
      ], { yaw: -0.4 * Math.PI, pitch: 0.22 * Math.PI, zoom: 0.82, shift: 5 }, 560)
    };
    await (designs[params.get("design")] ?? plan)();
  </script>
</body>
</html>
